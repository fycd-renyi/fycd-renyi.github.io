<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="崇德仁義珍貴照片典藏，可依人物、內容與地區篩選及下載。">
  <title>崇德仁義 照片</title>
  <link rel="stylesheet" href="photos.css?v=5">
  <script type="module" src="photos.js?v=18"></script>
  <link rel="stylesheet" href="/shared/site-footer.css?v=1">
  <script src="/shared/site-footer.js?v=1" defer></script>
</head>
<body>
  <a class="skip-link" href="#photo-feed">跳至照片</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="/" aria-label="崇德仁義首頁">
        <svg class="brand-lotus-lamp" viewBox="0 0 72 72" aria-hidden="true"><defs><linearGradient id="brandEmblemBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174d3a"/><stop offset="1" stop-color="#142e4b"/></linearGradient><linearGradient id="brandFlameGold" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#c78f2d"/><stop offset="1" stop-color="#fff0a8"/></linearGradient></defs><circle cx="36" cy="36" r="34" fill="url(#brandEmblemBg)"/><circle cx="36" cy="36" r="32.5" fill="none" stroke="#c79a3b"/><text x="13" y="40" text-anchor="middle" fill="#fff8e6" font-size="13" font-family="serif">仁</text><text x="59" y="40" text-anchor="middle" fill="#fff8e6" font-size="13" font-family="serif">義</text><path d="M36 9c5 6 6 11 1 16 1-4-1-7-3-9-4 5-4 9-1 12 2 2 5 1 7-1 5-6 3-12-4-18z" fill="url(#brandFlameGold)"/><g fill="#d7a94c" stroke="#f1d58b" stroke-width=".8"><path d="M36 48c-7-4-9-10-8-16 5 2 8 6 8 12 0-6 3-10 8-12 1 6-1 12-8 16z"/><path d="M34 50c-9-1-14-5-16-10 6-1 11 1 15 6-2-5-1-10 2-14 4 5 4 11-1 18z"/><path d="M38 50c9-1 14-5 16-10-6-1-11 1-15 6 2-5 1-10-2-14-4 5-4 11 1 18z"/><path d="M36 53c-10 0-17-3-20-8 7-1 13 0 20 5 7-5 13-6 20-5-3 5-10 8-20 8z"/></g><path d="M23 56h26M28 59h16" fill="none" stroke="#e6c878" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span><strong>崇德仁義</strong><small>紀念 · 傳承 · 典藏</small></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">選單</button>
      <nav id="site-nav" aria-label="主要導覽">
        <a href="/">首頁</a>
        <a href="https://fycd-renyi.github.io/library/">藏經閣</a>
        <a class="active" href="/photos/" aria-current="page">照片</a>
        <a href="/fortune/">求籤</a>
        <a href="/blessing/">仙佛詞語</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="photo-hero">
      <p class="eyebrow">珍貴影像 · 永續典藏</p>
      <h1><span>照片</span></h1>
      <p>依人物、內容或地區尋找照片，也可下載原始典藏檔案。</p>
    </section>

    <section class="photos-layout" aria-labelledby="gallery-title">
      <details class="filter-panel" open>
        <summary>篩選照片</summary>
        <form id="photo-filters">
          <div class="filter-heading">
            <h2>分類</h2>
            <button id="clear-filters" class="clear-button" type="button" disabled>清除篩選</button>
          </div>

          <fieldset>
            <legend>人物與內容</legend>
            <label><input type="checkbox" name="people" value="仁義大仙"> 仁義大仙</label>
            <details class="nested-options">
              <summary>仁義大仙分類</summary>
              <div class="nested-options-list" aria-label="仁義大仙分類">
                <label><input type="checkbox" name="renyiCategories" value="佛堂"> 佛堂</label>
                <label><input type="checkbox" name="renyiCategories" value="家人"> 家人</label>
                <label><input type="checkbox" name="renyiCategories" value="眾道親"> 眾道親</label>
                <label><input type="checkbox" name="renyiCategories" value="獨照"> 獨照</label>
              </div>
            </details>
            <label><input type="checkbox" name="people" value="老前人"> 老前人</label>
            <label><input type="checkbox" name="people" value="前人老"> 前人老</label>
            <label><input type="checkbox" name="topics" value="墨寶"> 墨寶</label>
            <details class="nested-options">
              <summary>墨寶分類</summary>
              <div class="nested-options-list" aria-label="墨寶分類">
                <label><input type="checkbox" name="inkCategories" value="朱玖塋贈送之墨寶"> 朱玖塋贈送之墨寶</label>
                <label><input type="checkbox" name="inkCategories" value="開台尊王借發書"> 開台尊王借發書</label>
                <label><input type="checkbox" name="inkCategories" value="對聯"> 對聯</label>
                <label><input type="checkbox" name="inkCategories" value="文章"> 文章</label>
                <label><input type="checkbox" name="inkCategories" value="佛"> 佛</label>
                <label><input type="checkbox" name="inkCategories" value="博愛"> 博愛</label>
                <label><input type="checkbox" name="inkCategories" value="四海一家"> 四海一家</label>
                <label><input type="checkbox" name="inkCategories" value="慈悲喜捨"> 慈悲喜捨</label>
                <label><input type="checkbox" name="inkCategories" value="浩然正氣"> 浩然正氣</label>
                <label><input type="checkbox" name="inkCategories" value="龍馬精神"> 龍馬精神</label>
                <label><input type="checkbox" name="inkCategories" value="仁者無敵"> 仁者無敵</label>
                <label><input type="checkbox" name="inkCategories" value="其他"> 其他</label>
              </div>
            </details>
          </fieldset>

          <fieldset>
            <legend>地區</legend>
            <div id="country-filters" class="country-options"></div>
          </fieldset>
        </form>
      </details>

      <div class="gallery-column">
        <div class="gallery-heading">
          <div><p class="eyebrow">照片典藏</p><h2 id="gallery-title">照片</h2></div>
          <p id="photo-count" aria-live="polite">載入中</p>
        </div>
        <div id="photo-feed" class="photo-feed"></div>
        <div id="empty-state" class="empty-state" hidden>
          <h3>找不到符合條件的照片</h3>
          <p>請改選其他分類，或清除目前的篩選條件。</p>
          <button id="empty-clear-filters" class="download-button" type="button">清除篩選</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div><strong>崇德仁義</strong><p>傳承仁義精神 · 留存珍貴記憶</p></div>
    <p>照片均依原始比例完整呈現</p>
  </footer>
</body>
</html>
